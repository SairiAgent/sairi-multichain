# EXPERIMENTAL configuration. No RPC endpoints, keys or forks are configured here; testnet scripts receive
# public RPC URLs from config/testnet/ via the Makefile and refuse any chain outside the testnet allowlist.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
# Pinned, hash-verified third-party sources (see dependencies/lock.json; `make deps-verify`).
libs = ["dependencies"]
remappings = [
    "@uniswap/v4-core/=dependencies/@uniswap/v4-core/",
    "dependencies/@uniswap/v4-core/:solmate/=dependencies/@uniswap/v4-core/lib/solmate/",
    "@layerzerolabs/oft-evm/=dependencies/@layerzerolabs/oft-evm/",
    "@layerzerolabs/oapp-evm/=dependencies/@layerzerolabs/oapp-evm/",
    "@layerzerolabs/lz-evm-protocol-v2/=dependencies/@layerzerolabs/lz-evm-protocol-v2/",
    "@layerzerolabs/lz-evm-messagelib-v2/=dependencies/@layerzerolabs/lz-evm-messagelib-v2/",
    "@openzeppelin/contracts/=dependencies/@openzeppelin/contracts/",
    "solidity-bytes-utils/=dependencies/solidity-bytes-utils/",
]
auto_detect_remappings = false
auto_detect_solc = true # Exact pragmas pin original code to 0.8.30 and upstream PoolManager to 0.8.26.
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = false
fs_permissions = [{ access = "read", path = "./out/PoolManager.sol/PoolManager.json" }]

[fmt]
ignore = ["dependencies/**"]

[lint]
# Naming lints are advisory and would also flag upstream naming conventions; run `forge lint` explicitly.
lint_on_build = false

[fuzz]
runs = 128

[invariant]
runs = 128
depth = 32
fail_on_revert = false
